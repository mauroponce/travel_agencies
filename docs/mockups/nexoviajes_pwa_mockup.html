const STORAGE_KEY='nexoviajes-demo-v3';
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){let o=JSON.parse(raw);if(o.trips?.length&&o.departures?.length)return o;}}catch(e){}return fresh();}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trip=id=>db.trips.find(t=>t.id===id);

 <div class="metrics">${metric('Micros programados',String(db.departures.length),'Una salida por micro','bus')}${metric('Puntos de embarque','7','Catálogo reutilizable','pin','blue')}${metric('Hoteles en Mendoza','3','Para un mismo micro','hotel','purple')}${metric('Coordinador asignado','1','Mendoza · 20 de octubre','users','amber')}</div><section class="card"><div class="panel-header"><div><h2>Salida Mendoza · Micro SRM 01</h2><small>20/10/2026 · Julieta Calvao · 7 puntos de embarque</small></div></div><div class="panel-body"><div class="notice-box green">${ico('checkcircle')} La hoja de ruta se genera automáticamente desde pasajeros confirmados, puntos de subida y hoteles asignados.</div><div style="margin-top:18px">${stopCatalog.map(s=>`<div class="stop-public"><div><b>${s.name}</b><small>${s.address}</small></div><span>${s.time}</span></div>`).join('')}</div></div></section>`;}
function routeView(){const d=dep('D1'),boarded=db.passengers.filter(p=>p.status==='boarded').length,absent=db.passengers.filter(p=>p.status==='absent').length,active=stopCatalog.find(s=>s.id===selectedStop)||stopCatalog[0],people=db.passengers.filter(p=>p.stop===active.id),here=people.filter(p=>p.status==='boarded').length;
 return `${head('Hoja de ruta','Controlá los embarques y seguí el recorrido desde tu celular.',`<button class="btn" onclick="showManifest()">${ico('download')} Lista de pasajeros</button>`,'OPERACIÓN EN MICRO · SIMULACIÓN')}
 <div class="route-summary"><div class="route-cover"><div class="route-scenery">${scenic('mountain')}</div><span class="pill" style="background:#ffffff23;color:#e4f9f3">${ico('bus','sm')} Micro SRM 01</span><h2>Mendoza · 20 de octubre</h2><p>Coordinadora: Julieta Calvao · 7 puntos de subida</p><p style="margin-bottom:0">${db.passengers.length} pasajeros registrados · ${d.capacity} lugares del micro</p></div><div class="route-stats"><div class="card route-stat"><div class="hint">Embarcados</div><div class="big">${boarded}<span style="color:#a8b3c0;font-size:18px"> / ${db.passengers.length}</span></div><div class="progress"><span style="width:${Math.round(boarded/Math.max(1,db.passengers.length)*100)}%"></span></div></div><div class="card route-stat"><div class="hint">Pendientes / ausentes</div><div class="big">${db.passengers.length-boarded-absent} <span style="color:#a8b3c0;font-size:14px">/ ${absent}</span></div><span class="pill amber" style="margin-top:10px">${absent} ausentes</span></div></div></div>
 <div class="route-grid"><section class="card"><div class="panel-header"><div><h2>Puntos de embarque</h2><small>Seleccioná una parada</small></div>${ico('route')}</div><div class="stoplist">${stopCatalog.map((s,i)=>{let all=db.passengers.filter(p=>p.stop===s.id);return `<button class="stop-item ${selectedStop===s.id?'active':''}" onclick="selectStop('${s.id}')"><span class="stop-bullet">${ico('pin')}</span><span><span class="name">${esc(s.name)}</span><span class="time">${s.time} · ${all.length} pasajeros</span></span><span class="count">${all.filter(p=>p.status==='boarded').length}/${all.length}</span></button>`}).join('')}</div></section><section class="card"><div class="panel-body"><div class="board-head"><div><div class="eyebrow">PARADA SELECCIONADA</div><h2 style="margin-top:11px">${esc(active.name)}</h2><div class="hint">${esc(active.address)} · ${active.time} h</div></div><span class="pill blue">${people.length} pasajeros</span></div><div class="board-stats"><div>${ico('checkcircle','sm')} ${here} embarcados</div><div>${ico('clock','sm')} ${people.filter(p=>p.status==='pending').length} pendientes</div></div><div style="height:1px;background:var(--line)"></div>${people.map(p=>`<div class="board-person"><span class="avatar-pill mint">${esc(p.name.split(' ').map(s=>s[0]).slice(0,2).join(''))}</span><div class="person-meta"><b>${esc(p.name)}</b><small>${esc(p.dni)} · ${esc(p.hotel)}</small></div>${p.status==='boarded'?`<button class="btn small soft" onclick="setBoardStatus('${p.id}','pending')">${ico('check')} Subió</button>`:p.status==='absent'?`<button class="btn small red" onclick="setBoardStatus('${p.id}','pending')">Ausente · revertir</button>`:`<button class="btn small" onclick="setBoardStatus('${p.id}','absent')">Ausente</button><button class="btn small teal" onclick="setBoardStatus('${p.id}','boarded')">${ico('check')} Subió</button>`}</div>`).join('')||`<div class="empty">No hay pasajeros asignados a esta parada</div>`}<p class="hint" style="margin-top:15px">Los cambios se guardan en esta demostración. La versión real sincronizaría el control con la empresa.</p></div></section></div>`;}
function setBoardStatus(id,status){const p=db.passengers.find(p=>p.id===id);if(!p)return;p.status=status;save();render();toast(status==='boarded'?`${p.name}: embarque registrado.`:status==='absent'?`${p.name}: marcado ausente.`:'Estado de embarque revertido.');}

function hotelsView(){let hotels=['Hotel Géminis','Hotel Aconcagua','Hotel Plaza Mendoza'];return `${head('Distribución por hoteles','El mismo micro lleva a cada pasajero a su alojamiento.',`<button class="btn" onclick="go('home')">${ico('route')} Volver a hoja de ruta</button>`,'LLEGADA AL DESTINO')}
 <div class="notice-box green" style="margin-bottom:18px">${ico('hotel')} <div>Ruta simplificada: el micro deja a los pasajeros en sus hoteles. No se contemplan trasbordos ni vehículos adicionales en la primera versión.</div></div><div class="trip-cards">${hotels.map((h,i)=>{const persons=db.passengers.filter(p=>p.hotel===h);const complete=db.completedHotels.includes(h);return `<div class="card"><div class="panel-body"><span class="avatar-pill mint" style="height:42px;width:42px">${ico('hotel')}</span><h3 style="margin:16px 0 6px;font-size:17px">${h}</h3><p class="hint">Parada ${i+1} de 3 en destino</p><div style="font-size:29px;font-weight:830;margin:14px 0">${persons.length} <span class="hint">pasajeros</span></div><p class="hint">${persons.slice(0,3).map(p=>p.name).join(', ')}${persons.length>3?' y otros...':''}</p><button class="btn ${complete?'soft':'primary'} full" style="margin-top:15px" onclick="markHotel('${h}')">${complete?ico('checkcircle'):ico('pin')} ${complete?'Parada completada':'Marcar parada completada'}</button></div></div>`}).join('')}</div>`;}
function markHotel(h){const index=db.completedHotels.indexOf(h);if(index===-1)db.completedHotels.push(h);else db.completedHotels.splice(index,1);save();render();toast(index===-1?`${h}: parada completada.`:`${h}: parada reabierta.`);}

 document.getElementById('app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="logo"><span class="logo-icon">${ico('route','xl')}</span><div class="logo-word">NexoViajes<small>PLATAFORMA TURÍSTICA</small></div></div><div class="workspace-pill"><span class="company-avatar">SV</span><div><b>Sanzó Viajes</b><span>Empresa de demostración</span></div>${ico('down','sm')}</div><div class="sidecap">MENÚ PRINCIPAL</div><nav class="sidenav" aria-label="Navegación del perfil">${nav.map(n=>`<button class="snav ${view===n[0]?'active':''}" title="${n[2]}" onclick="go('${n[0]}')">${ico(n[1])}<span class="nav-text">${n[2]}</span>${(n[0]==='news'&&unread)?`<span class="nav-count">${unread}</span>`:''}</button>`).join('')}</nav><div class="sidebar-footer"><p>PROTOTIPO INTERACTIVO V1.0<br>Datos ficticios. Sin servidor ni pagos reales.</p><button class="reset" onclick="resetDemo()">${ico('refresh')} <span>Restablecer demostración</span></button></div></aside><div class="main-column"><header class="topbar"><div class="top-left"><span class="crumb">Workspace</span><span class="crumb-slash">/</span><span class="crumb"><strong>${crumb()}</strong></span></div><div class="top-actions"><div class="role-switch" role="group" aria-label="Cambiar perfil">${Object.keys(ROLE_NAME).map(r=>`<button class="role-btn ${role===r?'selected':''}" onclick="setRole('${r}')">${ROLE_NAME[r]}</button>`).join('')}</div><button class="topicon" aria-label="Notificaciones" title="Notificaciones" onclick="openDrawer()">${ico('bell')}${unread?'<span class="notif-dot"></span>':''}</button><span class="user-avatar">${role==='admin'?'CA':role==='reseller'?'ML':'JC'}</span></div></header><main class="content" id="main-content">${content}</main></div></div><nav class="mobile-bottom" aria-label="Navegación móvil">${nav.slice(0,5).map(n=>`<button class="${view===n[0]?'active':''}" onclick="go('${n[0]}')">${ico(n[1])}<span>${n[2].length>13?n[2].split(' ')[0]:n[2]}</span></button>`).join('')}</nav><div class="demo-ribbon">DEMO INTERACTIVA · Datos simulados</div>`;
}

function openDrawer(){drawerOpen=true;const notices=db.notifications.filter(n=>n.role===role);document.getElementById('drawer-root').innerHTML=`<div class="drawer-overlay" onclick="closeDrawer()"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawer-top"><div><h2>Notificaciones</h2><p class="hint" style="margin-bottom:0">${notices.filter(n=>!n.read).length} sin leer</p></div><button class="xclose" onclick="closeDrawer()">${ico('close')}</button></div><div style="padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><span class="hint">Todas las novedades</span><button class="btn small" onclick="readAll()">Marcar como leídas</button></div><div class="drawer-body">${notices.map(n=>`<div class="notification-item"><span class="notifico">${ico(n.icon)}</span><div><b>${esc(n.title)} ${!n.read?'<span style="color:#21ac9e">●</span>':''}</b><p>${esc(n.text)}</p><small>${esc(n.date)}</small></div></div>`).join('')||'<div class="empty">No hay notificaciones todavía.</div>'}</div></aside></div>`;}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();}});
function resetDemo(){if(!confirm('¿Restablecer todos los datos de demostración? Se perderán las reservas y cambios realizados en este navegador.'))return;db=fresh();save();role='admin';view='home';selectedStop='varela';publicTripId=null;history.replaceState(null,'',location.pathname);closeModal();closeDrawer();render();toast('La demostración volvió a su estado inicial.');}
// Ficha pública sin registro ni formularios obligatorios.
function openPublic(id,seller=false){publicTripId=id;publicSeller=!!seller;const u=new URL(location.href);u.searchParams.set('vista','viaje');u.searchParams.set('id',id);u.searchParams.set('canal',seller?'revendedor':'empresa');history.pushState(null,'',u.toString());renderPublic();window.scrollTo(0,0);}
function backFromPublic(){publicTripId=null;const u=new URL(location.href);u.searchParams.delete('vista');u.searchParams.delete('id');u.searchParams.delete('canal');history.pushState(null,'',u.toString());render();window.scrollTo(0,0);}
function formPublicStops(){return stopCatalog.map(s=>`<div class="stop-public"><div><b>${esc(s.name)}</b><small>${esc(s.address)}</small></div><span>${s.time} hs</span></div>`).join('');}

argin-top:-8px">Puntos y horarios informados para esta salida (sujetos a confirmación operativa).</p>${formPublicStops()}</section><section class="card public-block public-faq"><h2>Preguntas frecuentes</h2><details open><summary>¿Cuánto tengo que pagar para reservar?</summary><p>${t.paymentFull?`Para esta oferta se solicita el importe completo de ${money(t.price+t.fee)} por persona, incluidos los gastos adicionales.`:`La seña mínima es de ${money(t.deposit)} por persona. El saldo debe cancelarse según las condiciones de la empresa, antes de la salida.`} Podés coordinar el medio de pago directamente con ${publicSeller?'tu revendedor':'la empresa'}.</p></details><details><summary>¿El precio incluye gastos de servicio?</summary><p>Los gastos adicionales son de ${money(t.fee)} por persona. El importe total publicado en el resumen contempla precio más gastos.</p></details><details><summary>¿Puedo elegir dónde subir al micro?</summary><p>Sí, podés seleccionar entre los puntos de embarque habilitados para esta salida al confirmar tus datos con el revendedor.</p></details><details><summary>¿Cómo se confirma la reserva?</summary><p>Contactás a la persona que te ofreció el viaje, coordinás el pago y le enviás tus datos. La reserva se confirma cuando el revendedor autorizado la registra y quedan lugares disponibles.</p></details><details><summary>¿Dónde queda el hotel?</summary><p>El hotel informado es ${esc(t.hotel)}. Solicitá el enlace de Maps o su sitio oficial cuando la empresa los haya incorporado a la ficha.</p></details></section><p class="center-note">Esta ficha es un prototipo de navegación con datos ilustrativos. No representa una venta ni una disponibilidad real.</p></div><aside class="card public-side"><div class="eyebrow">PRECIO POR PERSONA</div>${t.original>t.price?`<div class="old" style="margin-top:15px">Antes ${money(t.original)}</div>`:''}<div class="price-large money">${money(t.price)}</div><div class="price-caption">+ ${money(t.fee)} de gastos de servicio</div><div style="background:#f6f8fa;padding:12px;border-radius:10px;margin-top:17px;display:flex;justify-content:space-between;font-size:12px"><span>Precio total por persona</span><b class="money">${money(t.price+t.fee)}</b></div><div class="available ${free===0?'soldout':''}">${ico(free?'checkcircle':'alert')} ${free?`${free} ${free===1?'cupo disponible':'cupos disponibles'}`:'Sin cupos disponibles'}</div><div class="progress ${free<9?'orange':''}"><span style="width:${Math.round(d.occupied/d.capacity*100)}%"></span></div><p class="microtext">Los cupos se actualizan al confirmarse reservas. Consultar esta página no bloquea lugares.</p><div class="public-contact"><div class="hint" style="font-size:11px;margin-bottom:9px">Atención por ${publicSeller?'revendedor autorizado':'la empresa organizadora'}</div><button class="btn teal full" onclick="contactPreview('${t.id}')">${ico('phone')} Consultar por WhatsApp</button><button class="btn full" style="margin-top:9px" onclick="shareTrip('${t.id}',${publicSeller})">${ico('share')} Copiar enlace de esta ficha</button><p class="center-note" style="text-align:center;line-height:1.5;margin-top:14px">No necesitás registrarte ni completar un formulario.</p></div></aside></div></div>`;}
function linkForTrip(id,seller){const u=new URL(location.href);u.searchParams.set('vista','viaje');u.searchParams.set('id',id);u.searchParams.set('canal',seller?'revendedor':'empresa');return u.toString();}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Enlace copiado al portapapeles.')}catch(e){showModal('Copiar enlace','Seleccioná y copiá el enlace manualmente.',`<div class="field"><label>Enlace local del prototipo</label><textarea readonly onclick="this.select()">${esc(s)}</textarea></div>`,`<button class="btn primary" onclick="closeModal()">Listo</button>`);}}

function contactPreview(id){const t=trip(id);const msg=`Hola, quisiera consultar por ${t.destination}, salida ${longDate(dep(t.dep).date)}. Vi el precio de ${money(t.price)} más gastos. ¿Podemos coordinar la reserva?`;showModal('Conversación por WhatsApp','En el producto real, este botón abre el WhatsApp de quien compartió la ficha.',`<div class="notice-box green">${ico('phone')} Este prototipo no envía mensajes a números reales.</div><div style="margin-top:17px" class="field"><label>Mensaje sugerido para ${publicSeller?'el revendedor':'la empresa'}</label><textarea id="message-preview" style="height:110px">${esc(msg)}</textarea></div><p class="hint">La web pública no obliga al pasajero a registrarse ni ingresar sus datos.</p>`,`<button class="btn" onclick="closeModal()">Cerrar</button><button class="btn teal" onclick="copyText(document.getElementById('message-preview').value)">${ico('copy')} Copiar mensaje</button>`);}
function hotelInfo(id){const t=trip(id);showModal(t.hotel,'Enlaces informativos del alojamiento',`<div class="notice-box">${ico('info')} La empresa administrará el nombre, la ubicación en Google Maps, el sitio oficial y los servicios de cada hotel. Los enlaces de esta ficha de demostración aún no están configurados.</div><p class="hint" style="margin-top:17px">En el producto real, esta sección abre el sitio o la ubicación verificados del hotel correspondiente al paquete.</p>`,`<button class="btn primary" onclick="closeModal()">Entendido</button>`);}
function editPrice(id){const t=trip(id);showModal('Actualizar precio del viaje',`${t.destination} · salida ${longDate(dep(t.dep).date)}`,`<form id="price-form" onsubmit="savePrice(event,'${id}')"><div class="form-grid"><div class="field"><label>Precio vigente por persona ($)</label><input type="number" name="price" value="${t.price}" min="1" required></div><div class="field"><label>Gastos de servicio ($)</label><input type="number" name="fee" value="${t.fee}" min="0" required></div><div class="field"><label>Seña mínima ($)</label><input type="number" name="deposit" value="${t.deposit}" min="0" required></div><div class="field"><label>Condición para la venta</label><select name="paymentFull"><option value="true" ${t.paymentFull?'selected':''}>Pago completo</option><option value="false" ${!t.paymentFull?'selected':''}>Seña + saldo</option></select></div></div><div class="notice-box" style="margin-top:18px">${ico('spark')} <div>El mismo enlace público mostrará el nuevo precio inmediatamente. Las reservas confirmadas mantienen su importe anterior. Los cupos no cambian al actualizar la tarifa.</div></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="document.getElementById('price-form').requestSubmit()">${ico('check')} Guardar y notificar</button>`);}
function savePrice(e,id){e.preventDefault();const t=trip(id),fd=new FormData(e.target),old=t.price,newP=Number(fd.get('price')),fee=Number(fd.get('fee')),full=fd.get('paymentFull')==='true',deposit=full?newP+fee:Number(fd.get('deposit'));if(newP<1||fee<0||deposit<0||deposit>newP+fee){toast('Revisá el precio, los gastos y la seña.');return}t.original=t.original||old;t.price=newP;t.fee=fee;t.deposit=deposit;t.paymentFull=full;t.tag=newP<t.original?'SUPER SALE':t.tag==='SUPER SALE'?'DISPONIBLE':t.tag;notify('reseller','Precio actualizado: '+t.destination,`${money(old)} → ${money(newP)}. La ficha compartida muestra el nuevo precio.`,'percent');closeModal();render();toast(`Precio actualizado a ${money(newP)}. Revendedores notificados (simulación).`);}
function newTripModal(){showModal('Publicar un nuevo viaje','Cargá los datos esenciales para crear una salida independiente.',`<form id="new-trip" onsubmit="createTrip(event)"><div class="form-grid"><div class="field"><label>Nombre comercial *</label><input name="name" placeholder="Ej. Mendoza primavera" required></div><div class="field"><label>Destino *</label><input name="destination" placeholder="Ej. Mendoza Capital" required></div><div class="field"><label>Hotel *</label><input name="hotel" placeholder="Ej. Hotel Géminis" required></div><div class="field"><label>Fecha de salida *</label><input type="date" name="date" value="2026-12-12" required></div><div class="field"><label>Capacidad del micro *</label><input type="number" name="capacity" min="1" max="90" value="45" required></div><div class="field"><label>Micro asignado</label><input name="bus" placeholder="Ej. SRM 05"></div><div class="field"><label>Precio por persona ($) *</label><input type="number" name="price" min="1" value="219900" required></div><div class="field"><label>Gastos de servicio ($)</label><input type="number" name="fee" min="0" value="10000" required></div><div class="field"><label>Seña mínima ($)</label><input type="number" name="deposit" min="0" value="70000" required></div><div class="field"><label>Duración y noches</label><div style="display:flex;gap:9px"><input type="number" name="days" min="1" value="6" title="Días"><input type="number" name="nights" min="0" value="3" title="Noches"></div></div><div class="field wide"><label>Texto informativo</label><textarea name="description" placeholder="Contá qué incluye el viaje y qué puede esperar el pasajero..."></textarea></div></div><div class="notice-box" style="margin-top:18px">${ico('info')} La salida se crea con los cupos libres y con los puntos de embarque de ejemplo. No se envían avisos reales fuera del prototipo.</div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="document.get function createTrip(e){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f.entries());const id='T'+(++db.counter),did='D'+(++db.counter),price=+o.price,fee=+o.fee,deposit=+o.deposit;if(deposit>price+fee){toast('La seña no puede ser mayor que el precio total.');return}db.departures.push({id:did,date:o.date,code:'NEW-'+did,bus:o.bus||'A asignar',capacity:+o.capacity,occupied:0,coordinator:'A asignar',driver:'A asignar',stops:stopCatalog.map(s=>s.id),status:'active'});db.trips.unshift({id,name:o.name,destination:o.destination,hotel:o.hotel,days:+o.days||6,nights:+o.nights||3,dep:did,price,original:0,fee,deposit,paymentFull:false,tag:'NUEVA SALIDA',type:'valley',breakfast:true,includes:'Micro ida y vuelta, alojamiento y coordinación.',description:o.description||'Viaje en micro con alojamiento incluido.',active:true,whatsapp:'5491150001234'});notify('reseller','Nuevo viaje: '+o.destination,`Salida el ${longDate(o.date)} desde ${money(price)}.`,'bus');closeModal();go('trips');toast('Viaje publicado y novedad simulada para revendedores.');}
function inviteModal(){showModal('Invitar revendedor','La empresa podrá autorizar perfiles nuevos.',`<form id="invite-form" onsubmit="inviteSeller(event)"><div class="form-grid"><div class="field"><label>Nombre y apellido</label><input name="name" placeholder="Ej. Camila Núñez" required></div><div class="field"><label>Correo electrónico</label><input type="email" name="email" placeholder="nombre@ejemplo.com" required></div></div><div class="notice-box" style="margin-top:19px">${ico('mail')} Esta invitación se simula localmente. No se enviará ningún correo electrónico real.</div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="document.getElementById('invite-form').requestSubmit()">Invitar (simulación)</button>`);}
function inviteSeller(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')),email=String(f.get('email'));db.sellers.unshift({name,email,initials:name.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase(),sales:0,money:0,assigned:'Activa'});save();closeModal();render();toast('Revendedor agregado a la demo; no se envió correo.');}
let passengerCounter=0;
function passengerFields(n,seed=null){return `<div class="passenger-box" data-passenger="${n}"><div class="passenger-head">${ico('user','sm')} PASAJERO ${n}${n>1?`<button type="button" class="btn small red" style="margin-left:auto" onclick="removePassenger(this)">${ico('close','sm')} Quitar</button>`:''}</div><div class="form-grid"><div class="field"><label>Nombre y apellido *</label><input name="pass_name" placeholder="Nombre completo" value="${esc(seed?.name||'')}" required></div><div class="field"><label>DNI / documento *</label><input name="pass_dni" placeholder="Número de documento" value="${esc(seed?.dni||'')}" required></div><div class="field"><label>Nacionalidad</label><input name="pass_nation" value="Argentina" required></div><div class="field"><label>Punto de embarque *</label><select name="pass_stop" required>${stopCatalog.map(s=>`<option value="${s.id}" ${seed?.stop===s.id?'selected':''}>${esc(s.name)} · ${s.time}</option>`).join('')}</select></div><div class="field"><label>Habitación</label><select name="pass_room"><option>Doble</option><option>Triple</option><option>Cuádruple</option><option>Individual</option></select></div></div></div>`;}
function bookingModal(id,prefill=null){const t=trip(id);if(!t)return;if(sold(t)){toast('Esta opción ya no tiene cupos disponibles.');return}passengerCounter=1;const direct=role==='admin';showModal(direct?'Nueva reserva directa':'Confirmar nueva reserva',`${t.name} · ${available(t)} cupos disponibles · Hotel: ${t.hotel}`,`<form id="booking-form" onsubmit="submitBooking(event,'${id}')"><div class="notice-box green">${ico('shield')} <div><b>Confirmación automática.</b> Las reservas de un revendedor autorizado descuentan lugares de inmediato al declarar la seña, aun si la empresa todavía no recibió el dinero.</div></div><div class="input-section-title">Datos de los pasajeros <span class="pill blue" id="pass-count">1 pasajero</span></div><div id="passenger-fields">${passengerFields(1,prefill)}</div><button type="button" class="btn soft" onclick="addPassenger()">${ico('plus')} Agregar pasajero</button><div class="input-section-title">Información del pago recibido</div><div class="form-grid"><div class="field"><label>Importe recibido y declarado ($) *</label><input name="received" id="booking-received" type="number" min="0" value="${t.paymentFull?t.price+t.fee:t.deposit}" required><span class="form-help" id="booking-minimum">Mínimo para confirmar: ${money(t.paymentFull?t.price+t.fee:t.deposit)} por persona</span></div><div class="field"><label>Medio informado</label><select name="method"><option>Efectivo</option><option>Mercado Pago</option><option>Transferencia bancaria</option><option>Otro</option></select></div><div class="field wide"><label>Comprobante (opcional)</label><input type="file" name="proof" accept="image/*,.pdf"><span class="form-help">El archivo se selecciona en esta demo, pero no se envía ni guarda en un servidor.</span></div><div class="field wide"><label>Observaciones</label><textarea name="note" placeholder="Información para la empresa, lugar de entrega del efectivo, etc."></textarea></div></div><input type="hidden" name="source" value="${direct?'direct':'reseller'}"></form><p class="hint" style="margin-top:17px">${t.paymentFull?'Esta tarifa requiere pago completo.':'La empresa permite reservar con una seña y completar el saldo posteriormente.'} La confirmación depende de la disponibilidad al momento de guardar.</p>`,`<button class="btn" onclick="closeModal()">Cancelar</button>${!direct?`<button class="btn" onclick="passengerFormModal('${id}')">${ico('share')} Pedir datos por enlace</button>`:''}<button class="btn teal" onclick="document.getElementById('booking-form').requestSubmit()">${ico('check')} Confirmar y ocupar cupos</button>`,true);}
function addPassenger(){const c=document.getElementById('passenger-fields');if(!c)return;const tripId=(document.getElementById('booking-form')?.getAttribute('onsubmit')||'').match(/'([^']+)'/)?.[1];const t=trip(tripId)||trip('T1');const count=c.children.length;if(count>=Math.min(12,available(t))){toast('No se pueden agregar más pasajeros que los cupos disponibles (máximo 12 en la demo).');return}passengerCounter++;c.insertAdjacentHTML('beforeend',passengerFields(passengerCounter));updateBookingMin(t.id);}
function removePassenger(btn){btn.closest('.passenger-box').remove();const tripId=(document.getElementById('booking-form')?.getAttribute('onsubmit')||'').match(/'([^']+)'/)?.[1];updateBookingMin(tripId);}
function updateBookingMin(tripId){const t=trip(tripId);if(!t)return;const n=document.querySelectorAll('#passenger-fields .passenger-box').length;const el=document.getElementById('pass-count');if(el)el.textContent=n===1?'1 pasajero':`${n} pasajeros`;const min=(t.paymentFull?t.price+t.fee:t.deposit)*n;const inp=document.getElementById('booking-received');if(inp)inp.value=min;const hint=document.getElementById('booking-minimum');if(hint)hint.textContent=`Mínimo para confirmar: ${money(min)} por los ${n} pasajeros`;}
function submitBooking(e,tripId){e.preventDefault();const t=trip(tripId),d=dep(t.dep),nodes=[...document.querySelectorAll('#passenger-fields .passenger-box')],count=nodes.length,fd=new FormData(e.target),received=Number(fd.get('received'));if(!count||count>available(t)){toast('No hay cupos suficientes para la reserva.');return}const min=(t.paymentFull?t.price+t.fee:t.deposit)*count;if(received<min){toast(`Para esta opción se debe declarar al menos ${money(min)}.`);return}let persons=nodes.map(el=>({name:el.querySelector('[name="pass_name"]').value.trim(),dni:el.querySelector('[name="pass_dni"]').value.trim(),stop:el.querySelector('[name="pass_stop"]').value,nation:el.querySelector('[name="pass_nation"]').value,room:el.querySelector('[name="pass_room"]').value}));if(persons.some(p=>!p.name||!p.dni)){toast('Completá nombre y documento de cada pasajero.');return}const file=fd.get('proof'),proof=file&&file.name?file.name:'Sin comprobante adjunto',source=fd.get('source'),rid='R-'+(++db.counter),now=new Date().toLocaleDateString('es-AR');d.occupied+=count;db.reservations.unshift({id:rid,trip:t.id,seller:source==='direct'?'Empresa (directa)':'María López',names:persons.map(p=>p.name),count,paid:received,method:fd.get('method'),date:now,status:'confirmed',reconciled:false,source,note:fd.get('note')||'',priceAtBooking:t.price,feeAtBooking:t.fee,proof});if(d.id==='D1'){persons.forEach(p=>db.passengers.push({id:'P'+(++db.counter),name:p.name,dni:p.dni.length>4?'••••'+p.dni.slice(-4):'••••',stop:p.stop,hotel:t.hotel,status:'pending',resId:rid}));}db.payments.unshift({id:'RD-'+(++db.counter),res:rid,seller:source==='direct'?'Empresa (directa)':'María López',amount:received,method:fd.get('method'),date:'Hoy',status:'pending',proof});notify('admin','Nueva reserva confirmada',`${count} pasajero(s) en ${t.destination} · ${money(received)} declarados.`,'ticket');if(source==='reseller')notify('reseller','Reserva '+rid+' confirmada',`${count} cupo(s) ocupados para ${t.destination}.`,'checkcircle');closeModal();go('reservations');toast(`${rid} confirmada. Se descontaron ${count} cupo(s) del micro.`);}
function reservationDetails(id){const r=db.reservations.find(r=>r.id===id);if(!r)return;const t=trip(r.trip);showModal('Detalle de reserva '+r.id,`${r.count} pasajero(s) · ${t.destination}`,`<div class="form-grid"><div><div class="hint">Pasajeros</div><b style="display:block;margin-top:6px">${esc(r.names.join(', '))}</b></div><div><div class="hint">Canal de venta</div><b style="display:block;margin-top:6px">${esc(r.seller)}</b></div><div><div class="hint">Precio vigente al registrar</div><b style="display:block;margin-top:6px">${money(r.priceAtBooking??t.price)} / persona</b></div><div><div class="hint">Pago declarado</div><b style="display:block;margin-top:6px">${money(r.paid)} · ${esc(r.method)}</b></div><div><div class="hint">Fecha</div><b style="display:block;margin-top:6px">${esc(r.date)}</b></div><div><div class="hint">Estado de rendición</div><span class="pill ${r.reconciled?'green':'amber'}" style="margin-top:6px">${r.reconciled?'Verificada':'Pendiente de verificación'}</span></div></div><div class="notice-box" style="margin-top:18px">${ico('shield')} Esta reserva ya ocupa ${r.count} lugar(es). Verificar el dinero no cambia su estado de confirmación.</div>`,`<button class="btn primary" onclick="closeModal()">Cerrar</button>`);}
function paymentModal(){let list=db.reservations.filter(r=>role==='admin'||r.source==='reseller');showModal('Registrar un pago / rendición','Informá dinero recibido o entregado a la empresa.',`<form id="payment-form" onsubmit="submitPayment(event)"><div class="form-grid"><div class="field wide"><label>Reserva asociada *</label><select name="res" required>${list.map(r=>`<option value="${r.id}">${r.id} · ${esc(trip(r.trip).destination)} · ${esc(r.names.join(', '))}</option>`).join('')}</select></div><div class="field"><label>Importe ($) *</label><input name="amount" type="number" min="1" placeholder="Importe" required></div><div class="field"><label>Medio declarado</label><select name="method"><option>Efectivo</option><option>Mercado Pago</option><option>Transferencia bancaria</option><option>Otro</option></select></div><div class="field wide"><label>Comprobante (opcional)</label><input name="proof" type="file" accept="image/*,.pdf"></div><div class="field wide"><label>Observaciones</label><textarea name="note" placeholder="Transferí a la empresa / Tengo el efectivo / N° de operación..."></textarea></div></div></form><div class="notice-box amber" style="margin-top:16px">${ico('info')} El registro crea un movimiento pendiente. Solo la empresa puede marcarlo como verificado.</div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn teal" onclick="document.getElementById('payment-form').requestSubmit()">${ico('check')} Registrar movimiento</button>`);}
function submitPayment(e){e.preventDefault();let fd=new FormData(e.target),r=db.reservations.find(x=>x.id===fd.get('res')),amount=Number(fd.get('amount')),file=fd.get('proof');if(!r||amount<1){toast('Seleccioná reserva e importe válido.');return}const p={id:'RD-'+(++db.counter),res:r.id,seller:r.seller,amount,method:fd.get('method'),status:'pending',date:'Hoy',proof:file&&file.name?file.name:'Sin comprobante adjunto',note:fd.get('note')||''};db.payments.unshift(p);notify('admin','Nueva rendición declarada',`${money(amount)} declarados para la reserva ${r.id}.`,'wallet');closeModal();go('payments');toast('Movimiento registrado como pendiente de verificación.');}
function verifyPayment(id){const p=db.payments.find(x=>x.id===id);if(!p)return;showModal('Verificar rendición',`${p.id} · ${p.seller}`,`<div class="notice-box amber">${ico('alert')} Verificá por fuera del sistema que la empresa realmente recibió el dinero. Un archivo o captura no prueba por sí solo la acreditación.</div><div class="form-grid" style="margin-top:18px"><div><span class="hint">Reserva</span><h3>${p.res}</h3></div><div><span class="hint">Importe</span><h3 class="money">${money(p.amount)}</h3></div><div><span class="hint">Medio</span><h3>${esc(p.method)}</h3></div><div><span class="hint">Comprobante declarado</span><h3 style="font-size:12px">${esc(p.proof)}</h3></div></div><label style="display:flex;align-items:center;gap:9px;margin-top:18px;font-size:12px"><input type="checkbox" id="verified-check"> Confirmo que la empresa recibió el importe correspondiente.</label>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn teal" onclick="doVerify('${id}')">${ico('check')} Confirmar recepción</button>`);}
function doVerify(id){if(!document.getElementById('verified-check')?.checked){toast('Primero confirmá la recepción efectiva del dinero.');return}const p=db.payments.find(x=>x.id===id);p.status='verified';const r=db.reservations.find(r=>r.id===p.res);if(r){r.reconciled=db.payments.filter(p=>p.res===r.id).every(x=>x.status==='verified');}notify('reseller','Rendición verificada',`${p.id}: ${money(p.amount)} confirmados por la empresa.`,'checkcircle');closeModal();render();toast('Rendición marcada como verificada.');}
function showManifest(){const rows=[['Nombre','DNI (enmascarado)','Parada','Hotel','Estado'],...db.passengers.map(p=>[p.name,p.dni,stopCatalog.find(s=>s.id===p.stop)?.name||p.stop,p.hotel,p.status])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manifiesto_mendoza_demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Manifiesto CSV de demostración exportado.');}

let publicFormTrip=null,publicFormName='';
function passengerFormModal(id){const t=trip(id);showModal('Solicitar datos al pasajero',`Formulario privado de datos · ${t.destination}`,`<div class="field"><label>Nombre a precargar (opcional)</label><input id="prefill-name" placeholder="Ej. Laura González"></div><div class="notice-box" style="margin-top:18px">${ico('info')} El pasajero podrá completar sus datos sin iniciar sesión. <b>Esto no confirma ni reserva un cupo.</b> El revendedor registra la seña y confirma después.</div>`,`<button class="btn" onclick="closeModal()">Cerrar</button><button class="btn teal" onclick="generatePassengerForm('${id}')">${ico('share')} Generar enlace</button>`);}
function generatePassengerForm(id){const name=document.getElementById('prefill-name')?.value||'',u=new URL(location.href);u.searchParams.set('vista','formulario');u.searchParams.set('id',id);u.searchParams.set('canal','revendedor');u.searchParams.set('nombre',name);const url=u.toString();showModal('Enlace para el pasajero','Formulario de datos con identificador de demostración.',`<div class="field"><label>Enlace privado del prototipo</label><textarea id="generated-url" readonly style="height:105px" onclick="this.select()">${esc(url)}</textarea></div><div class="notice-box green" style="margin-top:16px">${ico('checkcircle')} En la versión real el enlace incluirá un identificador único, aleatorio y protegido, no solo los parámetros demostrativos.</div>`,`<button class="btn" onclick="openPassengerForm('${id}',decodeURIComponent('${encodeURIComponent(name).replace(/'/g,'%27')}'))">Ver formulario</button><button class="btn teal" onclick="copyText(document.getElementById('generated-url').value)">${ico('copy')} Copiar enlace</button>`);}
function openPassengerForm(id,name=''){closeModal();publicTripId=null;publicFormTrip=id;publicFormName=name;const u=new URL(location.href);u.searchParams.set('vista','formulario');u.searchParams.set('id',id);u.searchParams.set('nombre',name);history.pushState(null,'',u.toString());renderPassengerForm();}
function renderPassengerForm(){const t=trip(publicFormTrip);if(!t){backFromForm();return}document.getElementById('app').innerHTML=`<div class="public-shell"><header class="public-nav"><div class="public-brand"><span class="logo-icon">${ico('route')}</span>NexoViajes</div><button class="btn" onclick="backFromForm()">Volver al panel</button></header><div style="max-width:620px;margin:35px auto 80px;padding:0 16px"><div class="eyebrow">FORMULARIO PARA PASAJEROS</div><h1 style="font-size:30px;letter-spacing:-.9px">Tus datos para ${esc(t.destination)}</h1><p class="subtitle" style="margin-bottom:20px">Salida ${longDate(dep(t.dep).date)} · Hotel ${esc(t.hotel)}</p><section class="card panel-body"><div class="notice-box green">${ico('shield')} Completá tus datos para enviarlos al revendedor. No se exige ningún pago desde esta página y no queda un asiento reservado hasta que se confirme.</div><form id="passenger-public-form" onsubmit="submitPassengerForm(event,'${t.id}')" style="margin-top:20px"><div class="form-grid"><div class="field wide"><label>Nombre y apellido *</label><input name="name" value="${esc(publicFormName)}" required></div><div class="field"><label>Documento (DNI) *</label><input name="dni" placeholder="Tu número de documento" required></div><div class="field"><label>Nacionalidad *</label><input name="nationality" value="Argentina" required></div><div class="field"><label>Punto de embarque *</label><select name="stop">${stopCatalog.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.time}</option>`).join('')}</select></div><div class="field"><label>Tipo de habitación</label><select name="room"><option>Doble</option><option>Triple</option><option>Cuádruple</option><option>Individual</option></select></div><div class="field wide"><label>Notas (opcional)</label><textarea name="note" placeholder="Alguna información importante para el revendedor..."></textarea></div></div><button class="btn teal full" style="margin-top:20px" type="submit">Enviar mis datos al revendedor ${ico('arrow')}</button></form></section><p class="center-note" style="text-align:center;line-height:1.7;margin-top:15px">Mockup local: estos datos se guardarán únicamente en este navegador.</p></div></div>`;}
function submitPassengerForm(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());if(!db.drafts)db.drafts=[];db.drafts.unshift({id:'F-'+(++db.counter),trip:id,...f});save();notify('reseller','Datos de pasajero recibidos',`${f.name} completó el formulario para ${trip(id).destination}. Aún no tiene reserva confirmada.`,'file');document.getElementById('app').innerHTML=`<div class="public-shell"><div class="card" style="max-width:490px;margin:100px auto;padding:35px;text-align:center"><div style="background:#e7f8f1;color:#128875;border-radius:50%;height:58px;width:58px;display:grid;place-items:center;margin:auto">${ico('checkcircle','xl')}</div><h2 style="font-size:23px;letter-spacing:-.5px;margin:19px 0 8px">¡Datos enviados!</h2><p class="hint">El revendedor recibió una notificación en esta demostración. La reserva todavía no está confirmada y no se descontaron lugares.</p><button class="btn primary" style="margin-top:16px" onclick="backFromForm()">Volver al panel</button></div></div>`;}
function backFromForm(){publicFormTrip=null;publicFormName='';const u=new URL(location.href);['vista','id','nombre','canal'].forEach(k=>u.searchParams.delete(k));history.pushState(null,'',u.toString());render();}
function draftsCard(){const drafts=db.drafts||[];return drafts.length?`<section class="card" style="margin-bottom:17px"><div class="panel-header"><div><h2>Datos recibidos por formulario</h2><small>Sin reserva ni cupos ocupados hasta que declares la seña</small></div><span class="pill amber">${drafts.length} pendientes</span></div><div class="panel-body">${drafts.map(d=>`<div class="activity-row"><span class="activity-icon">${ico('file')}</span><div class="activity-copy"><b>${esc(d.name)} · ${esc(trip(d.trip)?.destination||'')}</b><p>${esc(d.dni)} · ${esc(stopCatalog.find(s=>s.id===d.stop)?.name||'')}</p></div><button class="btn small soft" onclick="bookDraft('${d.id}')">Reservar</button></div>`).join('')}</div></section>`:'';}
function bookDraft(id){const d=(db.drafts||[]).find(x=>x.id===id);if(!d)return;bookingModal(d.trip,{name:d.name,dni:d.dni,stop:d.stop});}
// Inicio y reservas del revendedor muestran formularios pendientes si existen.
const _resellerHome=resellerHome,_reservationsView=reservationsView;
resellerHome=function(){return _resellerHome()+draftsCard();};
reservationsView=function(){return (role==='reseller'?draftsCard():'')+_reservationsView();};
window.addEventListener('popstate',()=>{const u=new URL(location.href),v=u.searchParams.get('vista'),id=u.searchParams.get('id');publicTripId=null;publicFormTrip=null;if(v==='viaje'&&trip(id)){publicTripId=id;publicSeller=u.searchParams.get('canal')==='revendedor';renderPublic();}else if(v==='formulario'&&trip(id)){publicFormTrip=id;publicFormName=u.searchParams.get('nombre')||'';renderPassengerForm();}else render();});
(function init(){const url=new URL(location.href),v=url.searchParams.get('vista'),id=url.searchParams.get('id');if(v==='viaje'&&trip(id)){publicTripId=id;publicSeller=url.searchParams.get('canal')==='revendedor';renderPublic();}else if(v==='formulario'&&trip(id)){publicFormTrip=id;publicFormName=url.searchParams.get('nombre')||'';renderPassengerForm();}else render();})();
</script>
</body>
</html>
