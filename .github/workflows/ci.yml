name: CI

on:
  pull_request:
  push:

jobs:
  # Every setup-ruby step reads .ruby-version; RuntimeVersionTest checks Docker's pin.
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips poppler-utils

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bin/rails db:test:prepare test
          bin/rails zeitwerk:check
          bin/rails tenant_integrity:audit
          bin/rails agent:audit
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: npm run test:e2e

  docker_boot:
    name: Docker development boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build and boot the development stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180 web worker
          curl --retry 5 --retry-delay 1 --retry-all-errors --retry-max-time 30 --connect-timeout 3 --max-time 5 --fail http://127.0.0.1:3000/up
          curl --retry 5 --retry-delay 1 --retry-all-errors --retry-max-time 30 --connect-timeout 3 --max-time 5 --fail --header 'Host: platform.lvh.me' http://127.0.0.1:3000/ > /dev/null
          docker compose exec -T web bin/rails runner 'require "debug/prelude"; abort "wrong Rails environment" unless Rails.env.development?'
          docker compose exec -T web bin/rails agent:operations

      - name: Validate deployment Caddy configuration with the deployed image
        run: >-
          docker run --rm
          -e CADDY_SITE_ADDRESSES='staging.example.com, auth.staging.example.com'
          -e CADDY_ASK_SECRET=ci-validation-only
          -e PLATFORM_BASE_DOMAIN=staging.example.com
          -e PLATFORM_HOST=staging.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Verify disposable staging upgrade, storage persistence and backup restoration
        run: bin/smoke-staging

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail=150

      - name: Stop disposable CI services
        if: always()
        run: docker compose down

  required_checks:
    name: Required checks
    if: always()
    needs: [scan_ruby, scan_js, lint, test, docker_boot]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "A required job failed or was skipped"
          PYTHON
