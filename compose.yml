name: turistack-development

x-app-build: &app-build
  context: .
  args:
    BUNDLE_WITHOUT: test

x-app-environment: &app-environment
  RAILS_ENV: development
  RAILS_DEVELOPMENT_HOSTS: ".${PLATFORM_BASE_DOMAIN:-lvh.me}"
  APP_PORT: "3000"
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: turistack
  DB_PASSWORD: turistack
  DB_NAME: turistack_development
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  CONTAINERIZED: "true"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: turistack_development
      POSTGRES_USER: turistack
      POSTGRES_PASSWORD: turistack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turistack -d turistack_development"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
  migrate:
    build: *app-build
    command: bin/rails db:migrate
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    restart: "no"
    volumes:
      - storage_data:/rails/storage
    depends_on:
      db: {condition: service_healthy}
  web:
    build: *app-build
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: *app-build
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: ${ENV_FILE:-.env}
    environment: *app-environment
    volumes:
      - storage_data:/rails/storage
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  storage_data:
