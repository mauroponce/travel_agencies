name: turistack-production

x-app-environment: &app-environment
  RAILS_ENV: production
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER:?Definí POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB:?Definí POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?Definí POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CONTAINERIZED: "true"

x-app-service: &app-service
  image: ${TURISTACK_IMAGE:?Definí TURISTACK_IMAGE con un tag inmutable}
  env_file: ${ENV_FILE:-.env.production}
  environment: *app-environment
  volumes:
    - storage_data:/rails/storage

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Definí POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app-service
    command: bin/rails db:migrate
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  web:
    <<: *app-service
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *app-service
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    healthcheck:
      test: ["CMD", "bundle", "exec", "ruby", "bin/worker-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESSES: ${CADDY_SITE_ADDRESSES:?Definí CADDY_SITE_ADDRESSES}
      CADDY_ASK_SECRET: ${CADDY_ASK_SECRET:-}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:?Definí PLATFORM_BASE_DOMAIN}
      PLATFORM_HOST: ${PLATFORM_HOST:?Definí PLATFORM_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
