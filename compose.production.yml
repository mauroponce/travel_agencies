services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turistack_production}
      POSTGRES_USER: ${POSTGRES_USER:-turistack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: ${TURISTACK_IMAGE}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      RAILS_ENV: production
      RUN_MIGRATIONS: "true"
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-turistack}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-turistack_production}
      REDIS_URL: redis://redis:6379/0
    expose: ["3000"]
    volumes: ["storage_data:/rails/storage"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    image: ${TURISTACK_IMAGE}
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: ${ENV_FILE:-.env}
    environment:
      RAILS_ENV: production
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-turistack}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-turistack_production}
      REDIS_URL: redis://redis:6379/0
    volumes: ["storage_data:/rails/storage"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
