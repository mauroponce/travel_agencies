services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: nexoviajes_production
      POSTGRES_USER: nexoviajes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoviajes -d nexoviajes_production"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: ${NEXOVIAJES_IMAGE}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      RAILS_ENV: production
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgresql://nexoviajes:${POSTGRES_PASSWORD}@db:5432/nexoviajes_production
      REDIS_URL: redis://redis:6379/0
    expose: ["3000"]
    volumes: ["storage_data:/rails/storage"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    image: ${NEXOVIAJES_IMAGE}
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: ${ENV_FILE:-.env}
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://nexoviajes:${POSTGRES_PASSWORD}@db:5432/nexoviajes_production
      REDIS_URL: redis://redis:6379/0
    volumes: ["storage_data:/rails/storage"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
